<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="responsive.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Profile - Chamboli Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Arial, sans-serif; }
        body { background-color: #f4f7f6; min-height: 100vh; display: flex; flex-direction: column; }
        
        nav { 
            min-height: 85px; 
            background: linear-gradient(135deg, rgba(0, 30, 70, 0.95), rgba(0, 60, 120, 0.95)); 
            color: white; display: flex; align-items: center; justify-content: space-between; padding: 10px 5%;
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px); border-bottom: 2px solid rgba(0, 140, 255, 0.3);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }
        .logo { font-size: 26px; font-weight: 800; background: linear-gradient(45deg, #ffffff, #00d2ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .mobile-menu-btn { display: none; background: transparent; border: none; color: white; font-size: 28px; cursor: pointer; }
        .nav-links { display: flex; gap: 12px; align-items: center; }
        .nav-links a { color: white; text-decoration: none; padding: 8px 14px; border-radius: 6px; transition: all 0.3s; font-size: 14px; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { background: rgba(255, 255, 255, 0.2); }
        .logout-btn { background: #ef4444 !important; color: white !important; font-weight: 600; }
        .logout-btn:hover { background: #dc2626 !important; }

        .container { width: 90%; max-width: 800px; margin: 30px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .profile-header { display: flex; align-items: center; gap: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 20px; margin-bottom: 20px; }
        .profile-header img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #001e46; cursor: pointer; }
        .profile-info h2 { color: #001e46; margin-bottom: 5px; }
        .profile-info p { color: #64748b; font-size: 14px; }
        .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .detail-card { background: #f8fafc; padding: 15px; border-radius: 8px; border-left: 4px solid #008cff; }
        .detail-card label { display: block; font-size: 12px; color: #64748b; text-transform: uppercase; font-weight: 700; margin-bottom: 5px; }
        .detail-card span { font-size: 16px; font-weight: 600; color: #0f172a; }

        .edit-section { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 25px; margin-top: 20px; }
        .edit-section h3 { font-size: 18px; color: #001e46; margin-bottom: 15px; font-weight: 700; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: white; }
        .form-control:focus { border-color: #008cff; }

        .btn-save { padding: 12px 24px; background: #008cff; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px; width: 100%; }
        .btn-save:hover { background: #0070cc; }

        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center; }
        .modal img { max-width: 90%; max-height: 90%; border-radius: 8px; }

        @media (max-width: 950px) {
            .mobile-menu-btn { display: block; }
            .nav-links { display: none; width: 100%; flex-direction: column; position: absolute; top: 85px; left: 0; background: #001e46; padding: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
            .nav-links.active { display: flex; }
            .nav-links a { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Chamboli Staff</div>
        <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        <div class="nav-links" id="navLinksContainer">
            <a href="teacher-dashboard.html">Dashboard</a>
            <a href="student-list.html">Student List</a>
            <a href="class-register.html">Class Register</a>
            <a href="attendance-insights.html">Attendance Logs</a>
            <a href="input-marks.html">Input Marks</a>
            <a href="results.html">Results Feed</a>
            <a href="portal-chat.html">Portal Chat</a>
            <a href="teacher-profile.html" class="active">Profile</a>
            <a href="#" class="logout-btn" id="logoutBtn">Sign Out</a>
        </div>
    </nav>

    <div class="container">
        <div class="profile-header">
            <img id="profImg" src="https://via.placeholder.com/100" alt="Teacher Avatar" title="Click to expand">
            <div class="profile-info">
                <h2 id="profName">Loading Staff Profile...</h2>
                <p id="profEmail">--</p>
            </div>
        </div>

        <div class="detail-grid">
            <div class="detail-card">
                <label>Employee Number</label>
                <span id="profEmpNum">--</span>
            </div>
            <div class="detail-card">
                <label>Assigned Class</label>
                <span id="profClass">--</span>
            </div>
        </div>

        <!-- Edit Profile & Security Questions Form -->
        <div class="edit-section">
            <h3>✏️ Update Profile Details & Security Questions</h3>
            <form id="editProfileForm">
                <div class="form-group">
                    <label for="editName">Full Name</label>
                    <input type="text" id="editName" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="editClass">Assigned Primary Class</label>
                    <select id="editClass" class="form-control" required>
                        <option value="Form 1 C">Form 1 C</option>
                        <option value="Form 1 H">Form 1 H</option>
                        <option value="Form 1 A">Form 1 A</option>
                        <option value="Form 1 M">Form 1 M</option>
                        <option value="Form 1 B">Form 1 B</option>
                        <option value="Form 1 O">Form 1 O</option>

                        <option value="Form 2 C">Form 2 C</option>
                        <option value="Form 2 H">Form 2 H</option>
                        <option value="Form 2 A">Form 2 A</option>
                        <option value="Form 2 M">Form 2 M</option>
                        <option value="Form 2 B">Form 2 B</option>
                        <option value="Form 2 O">Form 2 O</option>

                        <option value="Grade 10 C">Grade 10 C</option>
                        <option value="Grade 10 H">Grade 10 H</option>
                        <option value="Grade 10 A">Grade 10 A</option>
                        <option value="Grade 10 M">Grade 10 M</option>
                        <option value="Grade 10 B">Grade 10 B</option>
                        <option value="Grade 10 O">Grade 10 O</option>

                        <option value="Grade 11 C">Grade 11 C</option>
                        <option value="Grade 11 H">Grade 11 H</option>
                        <option value="Grade 11 A">Grade 11 A</option>
                        <option value="Grade 11 M">Grade 11 M</option>
                        <option value="Grade 11 B">Grade 11 B</option>
                        <option value="Grade 11 O">Grade 11 O</option>

                        <option value="Grade 12 C">Grade 12 C</option>
                        <option value="Grade 12 H">Grade 12 H</option>
                        <option value="Grade 12 A">Grade 12 A</option>
                        <option value="Grade 12 M">Grade 12 M</option>
                        <option value="Grade 12 B">Grade 12 B</option>
                        <option value="Grade 12 O">Grade 12 O</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="editPic">Profile Image File</label>
                    <input type="file" id="editPic" class="form-control" accept="image/*">
                </div>

                <hr style="margin: 20px 0; border: none; border-top: 1px solid #cbd5e1;">
                <h4 style="font-size: 14px; color: #001e46; margin-bottom: 12px;">🛡️ Security Recovery Questions</h4>

                <div class="form-group">
                    <label for="editSecQ1">Security Question 1</label>
                    <select id="editSecQ1" class="form-control" required>
                        <option value="What was the name of your first primary school?">What was the name of your first primary school?</option>
                        <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
                        <option value="What was the name of your first pet?">What was the name of your first pet?</option>
                        <option value="What city or town were you born in?">What city or town were you born in?</option>
                    </select>
                    <input type="text" id="editSecA1" class="form-control" required placeholder="Answer to Question 1" style="margin-top: 8px;">
                </div>

                <div class="form-group">
                    <label for="editSecQ2">Security Question 2</label>
                    <select id="editSecQ2" class="form-control" required>
                        <option value="What is your favorite subject?">What is your favorite subject?</option>
                        <option value="What was your childhood nickname?">What was your childhood nickname?</option>
                        <option value="What is the name of your favorite teacher?">What is the name of your favorite teacher?</option>
                        <option value="What is your favorite food?">What is your favorite food?</option>
                    </select>
                    <input type="text" id="editSecA2" class="form-control" required placeholder="Answer to Question 2" style="margin-top: 8px;">
                </div>

                <button type="submit" id="saveProfileBtn" class="btn-save">Save Updated Details & Security Questions</button>
            </form>
        </div>
    </div>

    <div class="modal" id="imgModal">
        <img id="modalImage" src="" alt="Fullscreen Profile View">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyADOhDuRt3gEdLtVJw1nIfdGCjxvfeWAeo",
            authDomain: "chambolisecschool.firebaseapp.com",
            projectId: "chambolisecschool",
            storageBucket: "chambolisecschool.firebasestorage.app",
            messagingSenderId: "780031719021",
            appId: "1:780031719021:web:541a4975cb7c3a626df164"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const cloudName = "fw9ktj6z";
        const uploadPreset = "ml_default";

        let currentUserId = null;
        let existingPicUrl = "";

        const imgModal = document.getElementById("imgModal");
        const modalImage = document.getElementById("modalImage");
        const profImg = document.getElementById("profImg");

        const mobileMenuBtn = document.getElementById("mobileMenuBtn");
        if (mobileMenuBtn) {
            mobileMenuBtn.addEventListener("click", () => {
                document.getElementById("navLinksContainer").classList.toggle("active");
            });
        }

        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
            logoutBtn.addEventListener("click", async (e) => {
                e.preventDefault();
                if (confirm("Are you sure you want to sign out of Chamboli Portal?")) {
                    await signOut(auth);
                    window.location.href = "teacher-signin.html";
                }
            });
        }

        imgModal.addEventListener("click", () => { imgModal.style.display = "none"; });
        profImg.addEventListener("click", () => {
            if (profImg.src) {
                modalImage.src = profImg.src;
                imgModal.style.display = "flex";
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "teacher-signin.html"; return; }
            currentUserId = user.uid;

            const snap = await getDoc(doc(db, "teachers", user.uid));
            if(snap.exists()) {
                const data = snap.data();
                document.getElementById("profName").innerText = data.name || "Teacher Staff";
                document.getElementById("profEmail").innerText = data.email || "--";
                document.getElementById("profEmpNum").innerText = data.employeeNumber || "--";
                document.getElementById("profClass").innerText = data.assignedClass || "Unassigned";
                
                document.getElementById("editName").value = data.name || "";
                document.getElementById("editClass").value = data.assignedClass || "";

                if (data.securityQuestions) {
                    if (data.securityQuestions.q1) document.getElementById("editSecQ1").value = data.securityQuestions.q1;
                    if (data.securityQuestions.a1) document.getElementById("editSecA1").value = data.securityQuestions.a1;
                    if (data.securityQuestions.q2) document.getElementById("editSecQ2").value = data.securityQuestions.q2;
                    if (data.securityQuestions.a2) document.getElementById("editSecA2").value = data.securityQuestions.a2;
                }

                if (data.profilePicUrl) {
                    profImg.src = data.profilePicUrl;
                    existingPicUrl = data.profilePicUrl;
                }
            }
        });

        document.getElementById("editProfileForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("saveProfileBtn");
            btn.disabled = true;
            btn.innerText = "Saving Profile Updates...";

            const newName = document.getElementById("editName").value.trim();
            const newClass = document.getElementById("editClass").value;
            const fileInput = document.getElementById("editPic");

            const q1 = document.getElementById("editSecQ1").value;
            const a1 = document.getElementById("editSecA1").value.trim();
            const q2 = document.getElementById("editSecQ2").value;
            const a2 = document.getElementById("editSecA2").value.trim();

            if (q1 === q2) {
                alert("Please select two different security questions.");
                btn.disabled = false;
                btn.innerText = "Save Updated Details & Security Questions";
                return;
            }

            try {
                let imageUrl = existingPicUrl;
                if (fileInput.files.length > 0) {
                    btn.innerText = "Uploading New Avatar...";
                    const file = fileInput.files[0];
                    const formData = new FormData();
                    formData.append("file", file);
                    formData.append("upload_preset", uploadPreset);

                    const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
                        method: "POST",
                        body: formData
                    });
                    if (!res.ok) throw new Error("Image upload failed.");
                    const cloudData = await res.json();
                    imageUrl = cloudData.secure_url;
                }

                await updateDoc(doc(db, "teachers", currentUserId), {
                    name: newName,
                    assignedClass: newClass,
                    profilePicUrl: imageUrl,
                    securityQuestions: {
                        q1: q1,
                        a1: a1.toLowerCase(),
                        q2: q2,
                        a2: a2.toLowerCase()
                    }
                });

                if (auth.currentUser) {
                    await updateProfile(auth.currentUser, { displayName: newName, photoURL: imageUrl });
                }

                alert("Profile and Security Questions updated successfully!");
                window.location.reload();
            } catch (err) {
                alert("Failed to update profile: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Save Updated Details & Security Questions";
            }
        });
    </script>
</body>
</html>
