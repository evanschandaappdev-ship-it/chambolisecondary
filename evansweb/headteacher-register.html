<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="responsive.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Registration - Chamboli Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Arial, sans-serif; }
        
        body { 
            animation: pageOpen 1s ease; 
            overflow-x: hidden; 
            background-color: #f4f7f6; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }
        @keyframes pageOpen { 
            from { opacity: 0; transform: scale(.95); } 
            to { opacity: 1; transform: scale(1); } 
        }

        nav { 
            min-height: 85px; 
            background: linear-gradient(135deg, rgba(0, 30, 70, 0.95), rgba(0, 60, 120, 0.95)); 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 10px 5%; 
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(0, 140, 255, 0.3);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2); 
        }
        .logo { 
            font-size: 26px; 
            font-weight: 800; 
            background: linear-gradient(45deg, #ffffff, #00d2ff); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }

        .nav-links { display: flex; gap: 15px; align-items: center; }
        .nav-links a { color: rgba(255,255,255,0.85); text-decoration: none; font-weight: 600; font-size: 14px; transition: all 0.3s; padding: 10px 18px; border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); }
        .nav-links a:hover, .nav-links a.active { color: white; background: rgba(0, 140, 255, 0.25); border-color: rgba(0, 140, 255, 0.4); }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            background: transparent;
            border: none;
            outline: none;
        }

        .menu-toggle span {
            display: block;
            width: 28px;
            height: 3px;
            background-color: white;
            border-radius: 2px;
            transition: 0.3s;
        }

        @media (max-width: 992px) {
            .menu-toggle { display: flex; }
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 85px;
                left: 0;
                width: 100%;
                background: linear-gradient(135deg, rgba(0, 30, 70, 0.98), rgba(0, 60, 120, 0.98));
                padding: 20px;
                gap: 15px;
                border-bottom: 2px solid rgba(0, 140, 255, 0.3);
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
            }
            .nav-links.active { display: flex; }
            .nav-links a { width: 100%; text-align: center; }
        }

        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        
        .auth-container {
            max-width: 500px;
            padding: 45px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            width: 100%;
        }

        .auth-container h2 {
            margin-bottom: 20px;
            color: #001e46;
            text-align: center;
            font-size: 24px;
            font-weight: 800;
        }

        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            background: #fff;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #008cff;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #001e46, #003c78);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #0056b3;
        }

        .btn-submit:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        .auth-bottom-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }

        .auth-bottom-link a {
            color: #008cff;
            text-decoration: none;
            font-weight: bold;
        }

        .auth-bottom-link a:hover {
            text-decoration: underline;
        }

        footer {
            background: #001e46;
            color: white;
            text-align: center;
            padding: 25px 5%;
            margin-top: auto;
            font-size: 14px;
            border-top: 3px solid #008cff;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Chamboli Portal</div>
        <button class="menu-toggle" id="mobileMenuBtn">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-links" id="navContainer">
            <a href="index.html">Home</a>
            <a href="signin.html">Student Hub</a>
            <a href="register.html">Student Register</a>
            <a href="teacher-signin.html">Teacher Workspace</a>
            <a href="create-account.html">Teacher Setup</a>
            <a href="headteacher-signin.html">Executive Portal</a>
            <a href="headteacher-register.html" class="active">Executive Setup</a>
        </div>
    </nav>

    <main>
        <div class="auth-container">
            <h2>Executive Profile Setup</h2>
            <form id="headteacherRegisterForm">
                <div class="form-group">
                    <label for="fullName">Executive Full Name</label>
                    <input type="text" id="fullName" required placeholder="Enter full name">
                </div>
                <div class="form-group">
                    <label for="email">Official Email</label>
                    <input type="email" id="email" required placeholder="Enter admin email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Create password">
                </div>
                <div class="form-group">
                    <label for="passKey">Executive Passkey</label>
                    <input type="password" id="passKey" required placeholder="Enter executive registration key">
                </div>
                <div class="form-group">
                    <label for="profilePic">Executive Avatar</label>
                    <input type="file" id="profilePic" accept="image/*">
                </div>

                <hr style="margin: 20px 0; border: none; border-top: 1px solid #e2e8f0;">
                <h3 style="font-size: 15px; color: #001e46; margin-bottom: 12px;">🛡️ Security Recovery Questions</h3>

                <div class="form-group">
                    <label for="secQ1">Security Question 1</label>
                    <select id="secQ1" required>
                        <option value="" disabled selected>Select Question 1...</option>
                        <option value="What was the name of your first primary school?">What was the name of your first primary school?</option>
                        <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
                        <option value="What was the name of your first pet?">What was the name of your first pet?</option>
                        <option value="What city or town were you born in?">What city or town were you born in?</option>
                    </select>
                    <input type="text" id="secA1" required placeholder="Answer to Question 1">
                </div>

                <div class="form-group">
                    <label for="secQ2">Security Question 2</label>
                    <select id="secQ2" required>
                        <option value="" disabled selected>Select Question 2...</option>
                        <option value="What is your favorite subject?">What is your favorite subject?</option>
                        <option value="What was your childhood nickname?">What was your childhood nickname?</option>
                        <option value="What is the name of your favorite teacher?">What is the name of your favorite teacher?</option>
                        <option value="What is your favorite food?">What is your favorite food?</option>
                    </select>
                    <input type="text" id="secA2" required placeholder="Answer to Question 2">
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">Provision Executive Profile</button>
            </form>

            <div class="auth-bottom-link">
                Already registered? <a href="headteacher-signin.html">Sign In To Executive Panel</a>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 Chamboli Portal. All rights reserved.
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyADOhDuRt3gEdLtVJw1nIfdGCjxvfeWAeo",
            authDomain: "chambolisecschool.firebaseapp.com",
            projectId: "chambolisecschool",
            storageBucket: "chambolisecschool.firebasestorage.app",
            messagingSenderId: "780031719021",
            appId: "1:780031719021:web:541a4975cb7c3a626df164",
            measurementId: "G-PZZP7V0G4W"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const cloudName = "fw9ktj6z";
        const uploadPreset = "ml_default";

        const mobileMenuBtn = document.getElementById("mobileMenuBtn");
        const navContainer = document.getElementById("navContainer");
        if (mobileMenuBtn && navContainer) {
            mobileMenuBtn.addEventListener("click", () => {
                navContainer.classList.toggle("active");
            });
        }

        const form = document.getElementById("headteacherRegisterForm");
        const btn = document.getElementById("submitBtn");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            btn.disabled = true;
            btn.innerText = "Checking Registration Limit...";

            const name = document.getElementById("fullName").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const passKeyInput = document.getElementById("passKey").value.trim();
            const fileInput = document.getElementById("profilePic");

            const q1 = document.getElementById("secQ1").value;
            const a1 = document.getElementById("secA1").value.trim();
            const q2 = document.getElementById("secQ2").value;
            const a2 = document.getElementById("secA2").value.trim();

            if (q1 === q2) {
                alert("Please select two different security questions.");
                btn.disabled = false;
                btn.innerText = "Provision Executive Profile";
                return;
            }

            try {
                const headteachersSnap = await getDocs(collection(db, "headteachers"));
                if (headteachersSnap.size >= 5) {
                    alert("Registration Restricted: Maximum limit of 5 Headteacher accounts reached.");
                    btn.disabled = false;
                    btn.innerText = "Provision Executive Profile";
                    return;
                }

                btn.innerText = "Verifying Security Passkey...";

                const passkeySnap = await getDocs(collection(db, "pass-keys"));
                let validPasskey = null;
                passkeySnap.forEach(d => {
                    const data = d.data();
                    if (data["pass-key"] || data.passkey || data.passKey) {
                        validPasskey = data["pass-key"] || data.passkey || data.passKey;
                    }
                });

                if (!validPasskey || passKeyInput !== validPasskey) {
                    alert("Access Denied: Invalid Executive Security Passkey.");
                    btn.disabled = false;
                    btn.innerText = "Provision Executive Profile";
                    return;
                }

                let imageUrl = "";
                if (fileInput.files.length > 0) {
                    btn.innerText = "Syncing Executive Cloud Media...";
                    const file = fileInput.files[0];
                    const formData = new FormData();
                    formData.append("file", file);
                    formData.append("upload_preset", uploadPreset);
                    
                    const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
                        method: "POST",
                        body: formData
                    });
                    if(!res.ok) throw new Error("Asset cloud sync broken.");
                    const cloudData = await res.json();
                    imageUrl = cloudData.secure_url;
                }

                btn.innerText = "Configuring Auth credentials...";
                const creds = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(creds.user, { displayName: name, photoURL: imageUrl });

                await setDoc(doc(db, "headteachers", creds.user.uid), {
                    uid: creds.user.uid,
                    name: name,
                    email: email,
                    role: "headteacher",
                    profilePicUrl: imageUrl,
                    status: "Verified",
                    securityQuestions: {
                        q1: q1,
                        a1: a1.toLowerCase(),
                        q2: q2,
                        a2: a2.toLowerCase()
                    }
                });

                alert("Executive administrator profile built successfully!");
                window.location.href = "headteacher-dashboard.html";
            } catch(err) {
                alert("Account configuration failed: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Provision Executive Profile";
            }
        });
    </script>
</body>
</html>
