<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Head Teacher Chat - Chamboli Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Arial, sans-serif; }
        body { 
            background-color: #f4f7f6; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            animation: fadeIn 0.4s ease-in-out;
        }
        nav { min-height: 85px; background: linear-gradient(135deg, rgba(0, 30, 70, 0.95), rgba(0, 60, 120, 0.95)); color: white; display: flex; align-items: center; justify-content: space-between; padding: 10px 5%; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px); border-bottom: 2px solid rgba(0, 140, 255, 0.3); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2); }
        .logo { font-size: 26px; font-weight: 800; background: linear-gradient(45deg, #ffffff, #00d2ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-links { display: flex; gap: 10px; align-items: center; }
        .nav-links a { color: rgba(255, 255, 255, 0.85); text-decoration: none; font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 8px; transition: all 0.3s ease; }
        .nav-links a:hover, .nav-links a.active { background: rgba(0, 140, 255, 0.25); color: white; }
        
        #permissionBar { background: #008cff; color: white; text-align: center; padding: 10px 15px; font-size: 13px; font-weight: 700; cursor: pointer; display: none; }
        #topAppBanner { position: fixed; top: -100px; left: 5%; width: 90%; max-width: 500px; background: #001e46; color: white; padding: 15px 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35); border: 2px solid #008cff; z-index: 9999; display: flex; align-items: center; justify-content: space-between; transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; }
        #topAppBanner.show { top: 15px; }
        
        main { flex: 1; display: flex; height: calc(100vh - 85px); background: #fff; overflow: hidden; }
        .sidebar { width: 340px; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; background: #f8fafc; padding: 15px; overflow-y: auto; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #ffffff; }
        
        .chat-screens-bar { display: flex; background: #001e46; border-bottom: 2px solid #008cff; }
        .screen-tab { flex: 1; padding: 12px; text-align: center; color: rgba(255, 255, 255, 0.7); font-size: 13px; font-weight: 700; cursor: pointer; background: transparent; border: none; border-bottom: 3px solid transparent; transition: all 0.2s ease; }
        .screen-tab.active { color: #ffffff; background: rgba(0, 140, 255, 0.2); border-bottom: 3px solid #00d2ff; }
        
        .panel-title { font-size: 16px; font-weight: 700; color: #001e46; margin-bottom: 12px; }
        select, input, button { padding: 12px; border-radius: 8px; border: 2px solid #e2e8f0; font-size: 14px; outline: none; width: 100%; transition: border-color 0.2s ease; }
        select:focus, input:focus { border-color: #008cff; }
        .control-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
        .control-group label { font-size: 12px; font-weight: 700; color: #64748b; }
        
        .contact-card { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; cursor: pointer; background: white; border: 1px solid #e2e8f0; margin-bottom: 8px; transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease; }
        .contact-card:hover, .contact-card.active { background: #e0f2fe; border-color: #008cff; transform: translateX(3px); }
        .contact-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #008cff; }
        
        .chat-header { padding: 15px 20px; border-bottom: 1px solid #e2e8f0; background: #fff; font-weight: 700; color: #001e46; display: flex; align-items: center; justify-content: space-between; }
        .messages-container { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background: #f1f5f9; }
        .msg-row { display: flex; align-items: flex-end; gap: 8px; max-width: 75%; width: fit-content; animation: msgSlide 0.3s ease-out; }
        .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.them { align-self: flex-start; }
        .msg-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid #008cff; }
        .bubble { padding: 12px 16px; border-radius: 16px; font-size: 14px; word-break: break-word; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .msg-row.me .bubble { background: #008cff; color: white; border-bottom-right-radius: 2px; }
        .msg-row.them .bubble { background: white; color: #1e293b; border-bottom-left-radius: 2px; }
        .chat-input-bar { padding: 20px; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; background: #fff; }
        .send-btn { width: auto; background: #001e46; color: white; border: none; padding: 0 24px; font-weight: bold; cursor: pointer; transition: background 0.2s ease, transform 0.1s ease; }
        .send-btn:hover { background: #003370; }
        .send-btn:active { transform: scale(0.96); }

        /* KEYFRAME ANIMATIONS */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes msgSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <div id="permissionBar">🔔 Tap to enable notifications & sound</div>
    <div id="topAppBanner">
        <div><strong id="bannerTitle">Alert</strong><span id="bannerBody">Message...</span></div>
        <small style="color:#00d2ff; font-weight:bold;">DISMISS</small>
    </div>

    <nav>
        <div class="logo">Chamboli Executive</div>
        <div class="nav-links">
            <a href="headteacher-dashboard.html">Management Desk</a>
            <a href="headteacher-chat.html" class="active">Chat Hub</a>
            <a href="head-profile.html">Admin Profile</a>
        </div>
    </nav>

    <main>
        <div class="sidebar">
            <div class="panel-title">Broadcast Controls</div>
            <div class="control-group">
                <label>Transmission Target</label>
                <select id="headScopeSelect">
                    <option value="everyone">Broadcast: Everyone</option>
                    <option value="role_teachers">All Teachers</option>
                    <option value="role_students">All Students</option>
                    <option value="specific_class">Specific Class</option>
                </select>
            </div>
            <div id="headSubControl" class="control-group"></div>

            <div class="panel-title" style="margin-top: 10px;">User Contacts</div>
            <input type="text" id="contactSearchInput" placeholder="🔍 Search contacts..." autocomplete="off" style="margin-bottom:10px;">
            <div id="contactsList"></div>
        </div>

        <div class="chat-area">
            <div class="chat-screens-bar">
                <button class="screen-tab active" id="tabHead">🎓 Head Teacher Feed</button>
                <button class="screen-tab" id="tabTeacher">👨‍🏫 Teachers Channel</button>
                <button class="screen-tab" id="tabStudent">👨‍🎓 Students Channel</button>
            </div>

            <div class="chat-header">
                <span id="chatHeaderTitle">🎓 Head Teacher Stream</span>
                <button id="resetDirectChatBtn" style="display:none; width:auto; padding:6px 12px; font-size:12px; background:#e2e8f0; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Exit Direct Chat</button>
            </div>
            <div class="messages-container" id="messagesBox"></div>
            <form class="chat-input-bar" id="messageForm">
                <input type="text" id="textInput" placeholder="Type administrative announcement or message..." required autocomplete="off">
                <button type="submit" class="send-btn">Send</button>
            </form>
        </div>
    </main>

    <audio id="notifSound" src="universfield-new-notification-051-494246.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit, getDoc, doc, getDocs, where, deleteDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyADOhDuRt3gEdLtVJw1nIfdGCjxvfeWAeo",
            authDomain: "chambolisecschool.firebaseapp.com",
            projectId: "chambolisecschool",
            storageBucket: "chambolisecschool.firebasestorage.app",
            messagingSenderId: "780031719021",
            appId: "1:780031719021:web:541a4975cb7c3a626df164"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let myProfile = null;
        let activeScreenTab = "headteacher";
        let activeTargetId = null;
        let activeTargetName = "";
        let isSnapshotInitialized = false;
        const pageLoadTime = new Date();
        let allContacts = [];

        const scopeSelect = document.getElementById("headScopeSelect");
        const subControl = document.getElementById("headSubControl");
        scopeSelect.addEventListener("change", () => {
            if (scopeSelect.value === "specific_class") {
                subControl.innerHTML = `<label>Class Code</label><input type="text" id="targetClassCode" placeholder="e.g. Grade 10A" required>`;
            } else { subControl.innerHTML = ""; }
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) return;
            const userSnap = await getDoc(doc(db, "headteachers", user.uid));
            if (userSnap.exists()) {
                myProfile = userSnap.data();
                setupTabs();
                await loadContacts();
                listenToMessages();
            }
        });

        function setupTabs() {
            const tabs = [
                { id: "tabHead", val: "headteacher", title: "🎓 Head Teacher Stream" },
                { id: "tabTeacher", val: "teacher", title: "👨‍🏫 Teachers Channel" },
                { id: "tabStudent", val: "student", title: "👨‍🎓 Students Channel" }
            ];
            tabs.forEach(t => {
                document.getElementById(t.id).addEventListener("click", () => {
                    activeScreenTab = t.val;
                    activeTargetId = null;
                    tabs.forEach(x => document.getElementById(x.id).classList.toggle("active", x.val === activeScreenTab));
                    document.getElementById("chatHeaderTitle").innerText = t.title;
                    listenToMessages();
                });
            });
        }

        async function loadContacts() {
            allContacts = [];
            for (let col of ["teachers", "students", "headteachers"]) {
                const snap = await getDocs(collection(db, col));
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.uid === myProfile.uid) return;
                    allContacts.push({ uid: data.uid, name: data.name || 'User', role: col.toUpperCase(), photo: data.profilePicUrl || data.photoURL || "https://via.placeholder.com/150" });
                });
            }
            renderContacts(allContacts);
        }

        function renderContacts(list) {
            const container = document.getElementById("contactsList");
            container.innerHTML = "";
            list.forEach(c => {
                const card = document.createElement("div");
                card.className = `contact-card ${activeTargetId === c.uid ? 'active' : ''}`;
                card.innerHTML = `<img src="${c.photo}" class="contact-avatar"><div style="font-size:13px;"><strong>${c.name}</strong><br><small>${c.role}</small></div>`;
                card.addEventListener("click", () => {
                    activeTargetId = c.uid;
                    activeTargetName = c.name;
                    document.getElementById("chatHeaderTitle").innerText = `Direct Chat: ${c.name}`;
                    document.getElementById("resetDirectChatBtn").style.display = "inline-block";
                    listenToMessages();
                });
                container.appendChild(card);
            });
        }

        document.getElementById("resetDirectChatBtn").addEventListener("click", () => {
            activeTargetId = null;
            document.getElementById("resetDirectChatBtn").style.display = "none";
            document.getElementById("chatHeaderTitle").innerText = "🎓 Head Teacher Stream";
            listenToMessages();
        });

        function listenToMessages() {
            const q = query(collection(db, "chats"), orderBy("timestamp", "asc"), limit(100));
            onSnapshot(q, (snapshot) => {
                const box = document.getElementById("messagesBox");
                box.innerHTML = "";
                snapshot.forEach(docSnap => {
                    const m = docSnap.data();
                    let show = false;
                    if (activeTargetId) {
                        if (m.scope === "direct" && ((m.senderId === myProfile.uid && m.receiverId === activeTargetId) || (m.senderId === activeTargetId && m.receiverId === myProfile.uid))) show = true;
                    } else {
                        if (activeScreenTab === "headteacher" && (m.scope === "everyone" || m.senderRole === "headteacher")) show = true;
                        if (activeScreenTab === "teacher" && (m.senderRole === "teacher" || m.scope === "teachers")) show = true;
                        if (activeScreenTab === "student" && (m.senderRole === "student" || m.scope === "students" || m.scope === "class")) show = true;
                    }
                    if (show) {
                        const isMe = m.senderId === myProfile.uid;
                        const row = document.createElement("div");
                        row.className = `msg-row ${isMe ? 'me' : 'them'}`;
                        row.innerHTML = `<img src="${m.senderPhoto || 'https://via.placeholder.com/150'}" class="msg-avatar"><div><small style="font-size:10px; color:#64748b;">${m.senderName} (${m.senderRole})</small><div class="bubble">${m.text}</div></div>`;
                        box.appendChild(row);
                    }
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        document.getElementById("messageForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const input = document.getElementById("textInput");
            if (!input.value.trim()) return;

            const now = new Date();
            const expireDate = new Date();
            expireDate.setDate(expireDate.getDate() + 7);

            let payload = {
                senderId: myProfile.uid,
                senderName: myProfile.name,
                senderRole: "headteacher",
                senderPhoto: myProfile.profilePicUrl || "",
                text: input.value.trim(),
                timestamp: Timestamp.fromDate(now),
                expireAt: Timestamp.fromDate(expireDate),
                scope: "everyone"
            };

            if (activeTargetId) {
                payload.scope = "direct";
                payload.receiverId = activeTargetId;
            } else {
                const headScope = scopeSelect.value;
                if (headScope === "role_teachers") payload.scope = "teachers";
                else if (headScope === "role_students") payload.scope = "students";
                else if (headScope === "specific_class") {
                    payload.scope = "class";
                    payload.targetClassCode = document.getElementById("targetClassCode")?.value.trim() || "";
                }
            }

            await addDoc(collection(db, "chats"), payload);
            input.value = "";
        });
    </script>
</body>
</html>
